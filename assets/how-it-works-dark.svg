<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="How looper works: interview, decision tree, then gated loops">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#0d1117"/>
  <g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <g>
      <rect x="40" y="40" width="320" height="140" rx="14" fill="#161b22" stroke="#3a3f47"/>
      <text x="64" y="80" font-size="15" fill="#9a9a9a" font-weight="600" letter-spacing="1.5">STEP 1</text>
      <text x="64" y="114" font-size="28" fill="#f0f0f0" font-weight="700">Interview</text>
      <text x="64" y="144" font-size="17" fill="#9a9a9a">One question at a time.</text>
      <text x="64" y="166" font-size="17" fill="#f0f0f0">Ends in a brief you confirm.</text>
    </g>
    <line x1="368" y1="110" x2="432" y2="110" stroke="#9a9a9a" stroke-width="2.5" marker-end="url(#a)"/>
    <g>
      <rect x="440" y="40" width="320" height="140" rx="14" fill="#161b22" stroke="#3a3f47"/>
      <text x="464" y="80" font-size="15" fill="#9a9a9a" font-weight="600" letter-spacing="1.5">STEP 2</text>
      <text x="464" y="114" font-size="28" fill="#f0f0f0" font-weight="700">Decision tree</text>
      <text x="464" y="144" font-size="17" fill="#9a9a9a">Users, shape, scope, repo.</text>
      <text x="464" y="166" font-size="17" fill="#f0f0f0">Ends in one path, checkable done.</text>
    </g>
    <line x1="768" y1="110" x2="832" y2="110" stroke="#9a9a9a" stroke-width="2.5" marker-end="url(#a)"/>
    <g>
      <rect x="840" y="40" width="320" height="140" rx="14" fill="#f0f0f0"/>
      <text x="864" y="80" font-size="15" fill="#0d1117" opacity="0.7" font-weight="600" letter-spacing="1.5">STEP 3</text>
      <text x="864" y="114" font-size="28" fill="#0d1117" font-weight="700">Loop runner</text>
      <text x="864" y="144" font-size="17" fill="#0d1117" opacity="0.75">Small loops, one gate each.</text>
      <text x="864" y="166" font-size="17" fill="#0d1117">Ends shipped, with evidence.</text>
    </g>
    <path d="M1000 188 L1000 232 L600 232 L600 262" fill="none" stroke="#3a3f47" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="600" y="296" font-size="15" fill="#9a9a9a" font-weight="600" letter-spacing="1.5" text-anchor="middle">EVERY LOOP</text>
    <rect x="120" y="320" width="260" height="96" rx="14" fill="#161b22" stroke="#3a3f47"/>
    <text x="250" y="360" font-size="24" fill="#f0f0f0" font-weight="700" text-anchor="middle">Write</text>
    <text x="250" y="390" font-size="16" fill="#9a9a9a" text-anchor="middle">one agent, one brief</text>
    <line x1="388" y1="368" x2="462" y2="368" stroke="#9a9a9a" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="470" y="320" width="260" height="96" rx="14" fill="#161b22" stroke="#f0f0f0" stroke-width="2"/>
    <text x="600" y="360" font-size="24" fill="#f0f0f0" font-weight="700" text-anchor="middle">Gate</text>
    <text x="600" y="390" font-size="16" fill="#9a9a9a" text-anchor="middle">user yes · command · review</text>
    <line x1="738" y1="368" x2="812" y2="368" stroke="#9a9a9a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="775" y="356" font-size="15" fill="#9a9a9a" text-anchor="middle">pass</text>
    <rect x="820" y="320" width="260" height="96" rx="14" fill="#161b22" stroke="#3a3f47"/>
    <text x="950" y="360" font-size="24" fill="#f0f0f0" font-weight="700" text-anchor="middle">Next loop</text>
    <text x="950" y="390" font-size="16" fill="#9a9a9a" text-anchor="middle">evidence saved in the plan</text>
    <path d="M600 424 C 600 470 250 470 250 428" fill="none" stroke="#9a9a9a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="425" y="482" font-size="15" fill="#9a9a9a" text-anchor="middle">fail: back to the author</text>
    <text x="600" y="508" font-size="16" fill="#f0f0f0" font-weight="600" text-anchor="middle">The agent that writes a loop never gates it.</text>
  </g>
</svg>
