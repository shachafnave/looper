schema_version: '1.1'
name: loop-reviewer-seeded-bug
description: loop-reviewer agent on the seeded-bug fixture.
tags:
- loop-reviewer
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Dispatch the agent-loop-runner:loop-reviewer agent with only this brief. Loop output: `paginate.py`. Loop output promise: `paginate(items, page, per_page)` returns exactly `per_page` items for every full page, with `page` zero-based. Gate: `review`. Then reply with the reviewer''s report verbatim and nothing else.'
  max_turns: 20
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Agent
runs: 1
graders:
- type: tool_used
  name: dispatches-loop-reviewer
  tool: Agent
  min: 1
  input_match: loop-reviewer
- type: tool_used
  name: main-thread-no-edits
  tool: Edit
  min: 0
  max: 0
- type: regex
  name: quotes-bug-line
  pattern: paginate\.py:3
- type: regex
  name: severity-blocker
  pattern: blocker
  flags: i
- type: regex
  name: file-unchanged
  pattern: end = start \+ per_page - 1
  target:
    source: file
    path: paginate.py
- type: llm
  name: failure-scenario
  criteria: The report gives a concrete failing input such as paginate([1,2,3,4], 0, 2) returning [1] instead of [1, 2], and says the output does not deliver the declared promise.
- type: llm
  name: no-praise
  criteria: The report contains no praise of the code.
