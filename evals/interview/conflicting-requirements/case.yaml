schema_version: '1.1'
name: interview-conflicting-requirements
description: First interview turn on a conflicting requirements.
tags:
- interview
- first-turn
execution:
  prompt: I need a dashboard for our sales numbers. It has to be live, updated every second, but it must not touch the production database and we can only read the nightly CSV export. Keep it free and with zero setup for the five sales managers who will use it.
  max_turns: 8
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
runs: 1
graders:
- type: tool_used
  name: interview-skill-used
  tool: Skill
  min: 1
  input_match: interview
- type: llm
  name: one-question
  criteria: The reply asks exactly one question, or asks none and shows a brief for confirmation. It contains no code.
- type: llm
  name: names-conflict
  criteria: The reply names the conflict between updates every second and a nightly CSV only, and asks the user to choose rather than picking a side silently.
- type: file_exists
  name: writes-nothing
  path: '**'
  exists: false
- type: tool_used
  name: no-write
  tool: Write
  min: 0
  max: 0
- type: tool_used
  name: no-edit
  tool: Edit
  min: 0
  max: 0
