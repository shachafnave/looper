schema_version: '1.1'
name: loop-runner-bad-plan-dir-outside
description: 'Bad value case: plan-dir-outside.'
tags:
- loop-runner
- config
- refuse
- schema-invalid
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Use the agent-loop-runner:loop-runner skill. The path is agreed: add a `greet` CLI command with a passing test. Start the loops.'
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Write
  - Edit
  - Skill
  - Agent
runs: 1
graders:
- type: tool_used
  name: loop-runner-skill-used
  tool: Skill
  min: 1
  input_match: loop-runner
- type: regex
  name: names-failure
  pattern: plan_dir`? points outside the project
- type: regex
  name: says-cannot-start
  pattern: Cannot start
- type: file_exists
  name: no-plan-file
  path: docs/**
  exists: false
- type: tool_used
  name: no-branch-created
  tool: Bash
  min: 0
  max: 0
  input_match: git (switch|checkout)
- type: tool_used
  name: no-loop-dispatched
  tool: Agent
  min: 0
  max: 0
